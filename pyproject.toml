[project]
name = "stock-analyzer"
version = "0.1.0"
description = "Stock market portfolio analyzer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=6.7.0",
    "pyxirr>=0.10.8",
    "streamlit>=1.58.0",
    "yfinance>=1.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
